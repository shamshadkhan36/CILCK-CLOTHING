<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <!-- Path for curved brand text -->
    <path id="textArc" d="M 50,150 A 100,100 0 0,1 250,150" fill="none" />
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#ffffff" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Outer Dark Circle -->
  <circle cx="150" cy="150" r="142" fill="#111216" stroke="#f4f4f5" stroke-width="4.5" />
  
  <!-- Inner Ring Line -->
  <circle cx="150" cy="150" r="133" fill="none" stroke="#f4f4f5" stroke-width="1.8" stroke-dasharray="4 2" />

  <!-- Curved Brand Title "cilck clothing" -->
  <text fill="#ffffff" font-family="'Brush Script MT', 'Dancing Script', 'Caveat', cursive, sans-serif" font-size="29" font-weight="bold" letter-spacing="1">
    <textPath href="#textArc" startOffset="50%" text-anchor="middle">
      cilck clothing
    </textPath>
  </text>

  <!-- Sewing Machine Silhouette -->
  <g fill="#ffffff" transform="translate(75, 102) scale(0.68)">
    <!-- Main sewing machine arm and head -->
    <path d="M 30,110 L 190,110 C 195,110 198,106 198,100 L 198,45 C 198,25 180,15 155,15 L 70,15 C 50,15 40,25 40,40 L 40,48 L 75,48 L 75,40 C 75,32 80,28 90,28 L 145,28 C 160,28 175,35 175,50 L 175,80 C 175,90 168,95 155,95 L 45,95 L 45,65 L 30,65 Z" />
    
    <!-- Spool pin & thread spool on top -->
    <rect x="150" y="2" width="4" height="15" rx="1" />
    <rect x="145" y="5" width="14" height="10" rx="2" fill="#ffffff" />
    
    <!-- Balance hand wheel at right -->
    <rect x="200" y="32" width="10" height="42" rx="4" />
    <rect x="210" y="48" width="14" height="10" rx="2" />
    
    <!-- Needle bar & presser foot -->
    <rect x="33" y="65" width="4" height="40" rx="1" />
    <rect x="42" y="70" width="3" height="32" rx="1" />
    <path d="M 28,104 L 40,104 L 38,108 L 26,108 Z" />

    <!-- Machine Heavy Base Plate -->
    <rect x="10" y="112" width="202" height="15" rx="4" />
    <rect x="5" y="125" width="212" height="8" rx="3" />
  </g>

  <!-- ESTD & 2024 Pill badges on sides -->
  <g font-family="'Space Grotesk', 'Inter', sans-serif" font-weight="800" font-size="13" fill="#ffffff" letter-spacing="2">
    <!-- ESTD -->
    <rect x="36" y="180" width="62" height="20" rx="4" fill="#1f2026" stroke="#ffffff" stroke-width="1.2" />
    <text x="67" y="194.5" text-anchor="middle">ESTD</text>

    <!-- 2024 -->
    <rect x="202" y="180" width="62" height="20" rx="4" fill="#1f2026" stroke="#ffffff" stroke-width="1.2" />
    <text x="233" y="194.5" text-anchor="middle">2024</text>
  </g>

  <!-- Center divider subtle bar under sewing machine -->
  <line x1="102" y1="190" x2="198" y2="190" stroke="#f4f4f5" stroke-width="2" stroke-linecap="round" />

  <!-- Tailoring Scissors at Bottom -->
  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" transform="translate(150, 240) scale(0.95)">
    <!-- Left loop & blade -->
    <circle cx="-16" cy="18" r="8" fill="none" stroke-width="2.5" />
    <path d="M -11,12 L 0,0 L 15,-20" stroke-width="2.5" />

    <!-- Right loop & blade -->
    <circle cx="16" cy="18" r="8" fill="none" stroke-width="2.5" />
    <path d="M 11,12 L 0,0 L -15,-20" stroke-width="2.5" />

    <!-- Center Pivot Screw -->
    <circle cx="0" cy="0" r="2.5" fill="#ffffff" stroke="none" />
  </g>
</svg>
